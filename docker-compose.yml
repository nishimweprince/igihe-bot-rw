# The API needs no database service: retrieval is a single SQLite file
# (data/index/full.sqlite, see scripts/build_index.py). Ollama is optional
# (GENERATOR=ollama) for hosts without Apple Silicon.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    profiles: ["ollama"]

volumes:
  ollama:
