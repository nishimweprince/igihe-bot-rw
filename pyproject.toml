[project]
name = "igihe-assistant"
version = "0.1.0"
description = "IGIHE Kinyarwanda News Assistant — trigram retrieval over the full archive, Gemma on MLX"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
]
# Local generation on Apple Silicon (GENERATOR=mlx).
mlx = [
  "mlx-lm>=0.31,<0.32",
  "numpy>=2",
]
# Optional cross-encoder reranker bake-off (RERANKER_MODEL=...).
rerank = [
  "torch>=2.4",
  "transformers>=4.45",
  "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igihe_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
